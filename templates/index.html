<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет Финансов — Панель управления</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .navbar {
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
        }

        .card-custom {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
        }

        .form-control, .form-select {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #ffffff !important;
        }

        .form-control:focus, .form-select:focus {
            background-color: #2d2d2d;
            color: #ffffff !important;
            border-color: #0d6efd;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #777777;
        }

        .table {
            color: #ffffff !important;
            --bs-table-bg: #1e1e1e !important;
            --bs-table-hover-bg: #2d2d2d !important;
        }

        .table th {
            color: #bbbbbb !important;
            border-bottom-color: #333 !important;
            font-weight: 600;
            background-color: #1e1e1e !important;
        }

        .table td {
            border-bottom-color: #222 !important;
            vertical-align: middle;
            color: #ffffff !important;
            background-color: #1e1e1e !important;
        }

        .text-muted {
            color: #aaaaaa !important;
        }

        .text-light-custom {
            color: #e0e0e0 !important;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container" style="max-width: 1024px;">
        <span class="navbar-brand text-white fw-bold">💰 Мои Финансы</span>
        <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3">Выйти</button>
    </div>
</nav>

<div class="container" style="max-width: 1024px;">

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card-custom shadow-sm">
                <div class="text-uppercase tracking-wider text-muted small fw-medium">Текущий баланс</div>
                <h2 id="balance" class="fw-bold mt-2 text-white">0 сом</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-custom shadow-sm">
                <div class="text-uppercase tracking-wider text-success small fw-medium">Всего Доходов</div>
                <h2 id="total_income" class="fw-bold mt-2 text-success">+ 0 сом</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-custom shadow-sm">
                <div class="text-uppercase tracking-wider text-danger small fw-medium">Всего Расходов</div>
                <h2 id="total_expense" class="fw-bold mt-2 text-danger">- 0 сом</h2>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card-custom shadow-sm mb-4">
                <h4 class="fw-bold mb-4 text-light-custom">Новая операция</h4>
                <form id="transactionForm">
                    <div class="mb-3">
                        <label class="form-label text-light-custom small fw-medium">Тип операции</label>
                        <select id="type" class="form-select">
                            <option value="expense">Расход</option>
                            <option value="income">Доход</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light-custom small fw-medium">Сумма (сом)</label>
                        <input type="number" id="amount" class="form-control" placeholder="0.00" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label text-light-custom small fw-medium">Категория</label>
                        <select class="form-select" id="category" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light-custom small fw-medium">Описание</label>
                        <input type="text" id="description" class="form-control" placeholder="Комментарий к платежу">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-medium shadow-sm mt-2">
                        Сохранить
                    </button>
                </form>
            </div>

            <div class="card-custom shadow-sm text-center">
                <h5 class="text-white mb-3">Аналитика расходов</h5>
                <div class="mb-4" style="max-height: 220px; display: flex; justify-content: center;">
                    <canvas id="analyticsChart"></canvas>
                </div>

                <hr style="border-color: #333;">

                <div class="mt-4">
                    <h5 class="text-white mb-3">Соотношение доходов и расходов</h5>
                    <div style="max-height: 220px; display: flex; justify-content: center;">
                        <canvas id="incomeExpenseChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card-custom shadow-sm">
                <h4 class="fw-bold mb-4 text-light-custom">История операций</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Категория</th>
                            <th>Описание</th>
                            <th>Сумма</th>
                            <th class="text-end">Действие</th>
                        </tr>
                        </thead>
                        <tbody id="transactionTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const categoriesConfig = {
        expense: ["Транспорт/Бензин", "Продукты", "Жилье/Коммуналка", "Развлечения", "Одежда", "Прочее"],
        income: ["Зарплата", "Стипендия", "Подработка/Фриланс", "Подарок", "Прочее"]
    };

    let myChart = null;
    let barChart = null;

    // Конфигурация выпадающего списка категорий
    function updateCategorySelect() {
        const type = document.getElementById("type").value;
        const categorySelect = document.getElementById("category");
        categorySelect.innerHTML = "";

        categoriesConfig[type].forEach(cat => {
            const opt = document.createElement("option");
            opt.value = cat;
            opt.textContent = cat;
            categorySelect.appendChild(opt);
        });
    }

    // Загрузка данных пользователя (баланс, список операций и графики)
    async function loadData() {
        try {
            // 1. Получаем баланс
            const balanceRes = await fetch('/transactions/balance');
            if (balanceRes.status === 401) {
                window.location.href = '/login-page';
                return;
            }
            const balanceData = await balanceRes.json();

            document.getElementById('balance').innerText = `${balanceData.balance} сом`;
            document.getElementById('total_income').innerText = `+ ${balanceData.total_income} сом`;
            document.getElementById('total_expense').innerText = `- ${balanceData.total_expense} сом`;

            // Передаем итоговые суммы доходов и расходов в гистограмму
            renderBarChart(balanceData.total_income, balanceData.total_expense);

            // 2. Получаем список транзакций
            const txRes = await fetch('/transactions');
            const transactions = await txRes.json();

            const tableBody = document.getElementById('transactionTableBody');

            // Быстрая генерация таблицы в памяти
            const rows = transactions.map(tx => {
                const isIncome = tx.type === 'income';
                const amountClass = isIncome ? 'text-success fw-bold' : 'text-danger fw-bold';
                const prefix = isIncome ? '+' : '-';

                return `
                    <tr>
                        <td class="fw-medium text-white">${tx.category}</td>
                        <td class="text-muted small">${tx.description || ''}</td>
                        <td class="${amountClass}">${prefix} ${tx.amount} сом</td>
                        <td class="text-end">
                            <button onclick="deleteTransaction('${tx.id}')" class="btn btn-link link-danger text-decoration-none btn-sm fw-medium">Удалить</button>
                        </td>
                    </tr>
                `;
            }).join('');

            tableBody.innerHTML = rows;

            // 3. Обновляем график аналитики расходов
            renderAnalytics(transactions);

        } catch (err) {
            console.error("Ошибка при обновлении интерфейса:", err);
        }
    }

    // Отрисовка диаграммы аналитики расходов (круг)
    function renderAnalytics(transactions) {
        const canvas = document.getElementById('analyticsChart');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');

        const expenseData = {};
        transactions.forEach(t => {
            if (t.type === 'expense' || t.amount < 0) {
                const amt = Math.abs(t.amount);
                expenseData[t.category] = (expenseData[t.category] || 0) + amt;
            }
        });

        const labels = Object.keys(expenseData);
        const dataValues = Object.values(expenseData);

        if (myChart) {
            myChart.destroy();
        }

        if (labels.length === 0) {
            return;
        }

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: dataValues,
                    backgroundColor: ['#ff6b6b', '#4ecdc4', '#ffe66d', '#1a535c', '#a55eed', '#ff9f1c'],
                    borderWidth: 1,
                    borderColor: '#1e1e1e'
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: '#ffffff',
                            font: {family: 'system-ui'}
                        }
                    }
                }
            }
        });
    }

    // Отрисовка гистограммы доходов и расходов (столбцы)
    function renderBarChart(income, expense) {
        const canvas = document.getElementById('incomeExpenseChart');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');

        if (barChart) {
            barChart.destroy(); // Уничтожаем старый график перед обновлением
        }

        barChart = new Chart(ctx, {
            type: 'bar', // Тип графика — столбчатый
            data: {
                labels: ['Доходы', 'Расходы'],
                datasets: [{
                    label: 'Сумма в сомах',
                    data: [income, expense],
                    backgroundColor: ['#198754', '#dc3545'], // Зеленый для доходов, красный для расходов
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {color: '#ffffff'}, // Белый цвет текста для шкал
                        grid: {color: '#333333'}  // Темная сетка
                    },
                    x: {
                        ticks: {color: '#ffffff'},
                        grid: {display: false}
                    }
                },
                plugins: {
                    legend: {display: false} // Скрываем легенду
                }
            }
        });
    }

    // Слушатель формы создания новой записи
    document.getElementById('transactionForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            amount: parseFloat(document.getElementById('amount').value),
            category: document.getElementById('category').value,
            type: document.getElementById('type').value,
            description: document.getElementById('description').value || null
        };

        try {
            const res = await fetch('/transactions', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('transactionForm').reset();
                updateCategorySelect();
                await loadData();
            }
        } catch (error) {
            console.error("Ошибка при отправке транзакции:", error);
        }
    });

    // Функция удаления транзакции по ID
    async function deleteTransaction(id) {
        if (confirm("Вы уверены, что хотите удалить эту операцию?")) {
            try {
                const res = await fetch(`/transactions/${id}`, {method: 'DELETE'});
                if (res.ok) await loadData();
            } catch (error) {
                console.error("Ошибка при удалении транзакции:", error);
            }
        }
    }

    // Функция выхода
    function logout() {
        document.cookie = "user_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        window.location.href = '/login-page';
    }

    // Инициализация событий и первичной загрузки данных
    document.getElementById("type").addEventListener("change", updateCategorySelect);

    window.onload = function () {
        updateCategorySelect();
        loadData();
    };
</script>
</body>
</html>
