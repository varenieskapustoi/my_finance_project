<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация в системе</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
        }
        .form-control {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
        }
        .form-control:focus {
            background-color: #2d2d2d;
            color: white;
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="card shadow">
    <h3 class="text-center mb-4 text-white">Регистрация аккаунта</h3>
    <div id="alert-box" class="alert alert-danger d-none"></div>
    <div id="success-box" class="alert alert-success d-none">Регистрация успешна! Перенаправление...</div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label text-light">Новое имя пользователя</label>
            <input type="text" id="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-light">Пароль</label>
            <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Создать аккаунт</button>
    </form>
    <p class="text-center mt-3 mb-0"><a href="/login-page" class="text-info text-decoration-none">Уже есть аккаунт? Войти</a></p>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('alert-box');
        const successBox = document.getElementById('success-box');
        alertBox.classList.add('d-none');

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });

        const data = await response.json();

        if (response.ok) {
            successBox.classList.remove('d-none');
            setTimeout(() => {
                window.location.href = '/login-page';
            }, 1500);
        } else {
            alertBox.innerText = data.detail || 'Ошибка регистрации';
            alertBox.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
